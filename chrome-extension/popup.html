<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>Pajakia Coretax Co-Pilot</title>
  <style>
    body {
      width: 320px;
      margin: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      background: #f8fafc;
      color: #1a202c;
    }
    .header {
      background: linear-gradient(135deg, #1a56db, #1e40af);
      color: white;
      padding: 16px 20px;
    }
    .header h1 {
      margin: 0;
      font-size: 16px;
      font-weight: 700;
    }
    .header p {
      margin: 2px 0 0;
      font-size: 11px;
      opacity: 0.85;
    }
    .body {
      padding: 16px 20px;
    }
    .status {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 12px;
      border-radius: 8px;
      margin-bottom: 16px;
      font-size: 13px;
    }
    .status-ok {
      background: #dcfce7;
      color: #166534;
    }
    .status-warn {
      background: #fef3c7;
      color: #92400e;
    }
    .status-down {
      background: #fee2e2;
      color: #991b1b;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .status-ok .status-dot { background: #16a34a; }
    .status-warn .status-dot { background: #d97706; }
    .status-down .status-dot { background: #dc2626; }
    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-bottom: 16px;
    }
    .stat-card {
      background: white;
      border: 1px solid #e2e8f0;
      border-radius: 8px;
      padding: 10px 12px;
    }
    .stat-label {
      font-size: 10px;
      color: #64748b;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .stat-value {
      font-size: 20px;
      font-weight: 800;
      margin-top: 2px;
    }
    .actions {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }
    .btn {
      padding: 10px 14px;
      border-radius: 8px;
      font-size: 13px;
      font-weight: 600;
      text-align: center;
      cursor: pointer;
      border: none;
      text-decoration: none;
      display: block;
    }
    .btn-primary {
      background: #1a56db;
      color: white;
    }
    .btn-primary:hover {
      background: #1e40af;
    }
    .btn-secondary {
      background: white;
      color: #1a202c;
      border: 1px solid #e2e8f0;
    }
    .btn-secondary:hover {
      background: #f1f5f9;
    }
    .footer {
      padding: 12px 20px;
      border-top: 1px solid #e2e8f0;
      font-size: 11px;
      color: #64748b;
      text-align: center;
    }
    .footer a {
      color: #1a56db;
      text-decoration: none;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>⚡ Pajakia Co-Pilot</h1>
    <p>Coretax Helper Extension v0.1.0</p>
  </div>

  <div class="body">
    <div id="status" class="status status-ok">
      <div class="status-dot"></div>
      <span id="status-text">Coretax: Memeriksa...</span>
    </div>

    <div class="stats">
      <div class="stat-card">
        <div class="stat-label">Drafts</div>
        <div class="stat-value" id="draft-count">0</div>
      </div>
      <div class="stat-card">
        <div class="stat-label">Errors decoded</div>
        <div class="stat-value" id="decoded-count">0</div>
      </div>
    </div>

    <div class="actions">
      <a href="https://pajakai.vercel.app/konsultan/coretax" target="_blank" class="btn btn-primary">
        Buka Pajakia Dashboard
      </a>
      <button class="btn btn-secondary" id="open-coretax">
        Buka Coretax DJP
      </button>
      <button class="btn btn-secondary" id="view-drafts">
        📋 Lihat Drafts
      </button>
      <button class="btn btn-secondary" id="view-audit">
        📝 Audit Log
      </button>
    </div>
  </div>

  <div class="footer">
    <a href="https://pajakai.vercel.app" target="_blank">pajakai.vercel.app</a> · Made for konsultan pajak Indonesia
  </div>

  <script src="popup.js"></script>
</body>
</html>
